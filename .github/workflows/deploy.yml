name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t krishnnajaiswal/zero-touch-deployment:latest ./app

      - name: Push Docker Image
        run: |
          docker push krishnnajaiswal/zero-touch-deployment:latest
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PUBLIC_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
           docker pull krishnnajaiswal/zero-touch-deployment:latest

           docker stop app || true

           docker rm app || true

           docker run -d \
           --name app \
           --restart unless-stopped \
           -p 80:8000 \
           krishnnajaiswal/zero-touch-deployment:latest